; Rilevatore di cadute per anziani - Seeed Studio XIAO ESP32S3 Sense
;
;   pio run -e xiao_esp32s3 -t upload   -> compila e carica il firmware
;   pio device monitor                  -> log seriale (115200 baud)
;   pio test -e native                  -> test dell'algoritmo sul PC
;   pio run -e xiao_esp32s3_cnn -t upload -> variante con classificatore CNN (TFLite Micro)

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
build_src_filter = +<*> -<posture_model_data.cc>

; Variante con la CNN di postura (vedi docs/CNN.md).
[env:xiao_esp32s3_cnn]
extends = env:xiao_esp32s3
build_flags =
  ${env:xiao_esp32s3.build_flags}
  -DUSE_POSTURE_CNN
lib_deps =
  ${env:xiao_esp32s3.lib_deps}
  tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
build_src_filter = +<*>

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no
