name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Test dell'algoritmo (PC)
        run: pio test -e native
      - name: Compilazione firmware XIAO ESP32S3
        run: pio run -e xiao_esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/xiao_esp32s3/firmware.bin
